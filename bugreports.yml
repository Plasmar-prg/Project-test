---
- summary: |
    В карточке товара в каталоге не отображается рейтинг
  test-cases: [2]
  environment: |
    Тестируемое приложение: https://products-store.hexlet.app/ (версия 1)
    Google Chrome 156.0.8078.48 (64 бит)
    ОС Windows 10 (10.0.19045)
  steps-to-reproduce: |
    1. Открыть главную страницу https://products-store.hexlet.app/
    2. Найти карточку товара «Essence Mascara Lash Princess»
    3. Сравнить содержимое карточки с требованиями к каталогу
  expected-result: |
    В карточке каталога отображаются название, рейтинг, цена со скидкой и без нее
  actual-result: |
    В карточке отображаются название, описание, цена без скидки, цена со скидкой и остаток
    Рейтинг в карточке отсутствует

- summary: |
    Кнопка «Previous» отображается на первой странице каталога и не выполняет действие
  test-cases: [5]
  environment: |
    Тестируемое приложение: https://products-store.hexlet.app/ (версия 1)
    Google Chrome 156.0.8078.48 (64 бит)
    ОС Windows 10 (10.0.19045)
  steps-to-reproduce: |
    1. Открыть главную страницу https://products-store.hexlet.app/
    2. Проверить блок пагинации
    3. Нажать кнопку «Previous»
  expected-result: |
    На первой странице каталога кнопка «Previous» недоступна или не отображается
  actual-result: |
    Кнопка «Previous» отображается и кликабельна
    При нажатии ничего не происходит, в адресной строке появляется символ «#»

- summary: |
    Поиск товаров работает только в пределах текущей страницы каталога
  test-cases: [6]
  environment: |
    Тестируемое приложение: https://products-store.hexlet.app/ (версия 1)
    Google Chrome 156.0.8078.48 (64 бит)
    ОС Windows 10 (10.0.19045)
  steps-to-reproduce: |
    1. Открыть главную страницу https://products-store.hexlet.app/
    2. Ввести в поле поиска запрос «Lemon»
    3. Убедиться, что товар «Lemon» находится на второй странице каталога
  expected-result: |
    Поиск выполняется по всему каталогу, и в результатах отображается товар «Lemon»
  actual-result: |
    Поиск выполняется только по 30 товарам текущей страницы
    Отображается сообщение «Nothing found!», хотя товар существует на второй странице

- summary: |
    Список категорий в фильтре неполный
  test-cases: [8]
  environment: |
    Тестируемое приложение: https://products-store.hexlet.app/ (версия 1)
    Google Chrome 156.0.8078.48 (64 бит)
    ОС Windows 10 (10.0.19045)
  steps-to-reproduce: |
    1. Открыть главную страницу https://products-store.hexlet.app/
    2. Открыть выпадающий список «Category»
    3. Сравнить список категорий с категориями товаров во всем каталоге
  expected-result: |
    В фильтре доступны все категории товаров каталога
  actual-result: |
    В фильтре отображаются только 4 категории, которые присутствуют на текущей странице: beauty, fragrances, furniture, groceries
    Категории товаров с других страниц каталога недоступны

- summary: |
    Поле максимальной цены в фильтре содержит сумму цен товаров вместо максимальной цены
  test-cases: [11]
  environment: |
    Тестируемое приложение: https://products-store.hexlet.app/ (версия 1)
    Google Chrome 156.0.8078.48 (64 бит)
    ОС Windows 10 (10.0.19045)
  steps-to-reproduce: |
    1. Открыть главную страницу https://products-store.hexlet.app/
    2. Обратить внимание на подсказку и атрибут max поля максимальной цены в блоке «Price»
  expected-result: |
    В поле максимальной цены указана максимальная цена товара на странице (2499.99$)
  actual-result: |
    В поле указано значение 6577.499999999995, равное сумме цен всех товаров на странице

- summary: |
    Снятие галочки «In Stock» скрывает все товары каталога
  test-cases: [12]
  environment: |
    Тестируемое приложение: https://products-store.hexlet.app/ (версия 1)
    Google Chrome 156.0.8078.48 (64 бит)
    ОС Windows 10 (10.0.19045)
  steps-to-reproduce: |
    1. Открыть главную страницу https://products-store.hexlet.app/
    2. Снять галочку «In Stock» в блоке фильтров
  expected-result: |
    Отображаются все товары каталога, включая отсутствующие в наличии
    Каталог не становится пустым
  actual-result: |
    Каталог становится пустым, так как фильтр оставляет только товары с остатком 0

- summary: |
    Кнопка «Delete» в корзине уменьшает количество товара на 1 вместо удаления товара
  test-cases: [17]
  environment: |
    Тестируемое приложение: https://products-store.hexlet.app/ (версия 1)
    Google Chrome 156.0.8078.48 (64 бит)
    ОС Windows 10 (10.0.19045)
  steps-to-reproduce: |
    1. Добавить товар «Essence Mascara Lash Princess» в корзину два раза
    2. Перейти на страницу корзины /cart
    3. Нажать кнопку «Delete» напротив товара
  expected-result: |
    Товар полностью удаляется из корзины
    Счетчик товаров в шапке и итоговая сумма пересчитываются
  actual-result: |
    Количество товара уменьшается с 2 до 1, товар остается в корзине
    Для полного удаления товара кнопку нужно нажать повторно

- summary: |
    Оформление заказа завершается ошибкой сервера, но интерфейс сообщает об успехе
  test-cases: [20]
  environment: |
    Тестируемое приложение: https://products-store.hexlet.app/ (версия 1)
    Google Chrome 156.0.8078.48 (64 бит)
    ОС Windows 10 (10.0.19045)
  steps-to-reproduce: |
    1. Добавить товар в корзину
    2. Перейти на страницу корзины /cart
    3. Нажать кнопку «Checkout»
    4. Проверить запрос POST /api/orders в DevTools
  expected-result: |
    Заказ успешно создан на сервере
    Пользователь переходит на страницу оплаты
    Корзина очищается после успешного оформления заказа
  actual-result: |
    Запрос POST /api/orders возвращает статус 500
    Отображается модальное окно «Order placed successfully»
    Перехода на страницу оплаты нет, корзина не очищается

- summary: |
    Выбранный язык интерфейса не сохраняется после перезагрузки страницы
  test-cases: [22]
  environment: |
    Тестируемое приложение: https://products-store.hexlet.app/ (версия 1)
    Google Chrome 156.0.8078.48 (64 бит)
    ОС Windows 10 (10.0.19045)
  steps-to-reproduce: |
    1. Открыть главную страницу https://products-store.hexlet.app/
    2. В меню «Language» выбрать «Russian»
    3. Перезагрузить страницу
  expected-result: |
    После перезагрузки интерфейс остается на русском языке
  actual-result: |
    После перезагрузки интерфейс снова отображается на английском языке

- summary: |
    Страница несуществующего товара остается пустой и возникает ошибка JavaScript
  test-cases: [23]
  environment: |
    Тестируемое приложение: https://products-store.hexlet.app/ (версия 1)
    Google Chrome 156.0.8078.48 (64 бит)
    ОС Windows 10 (10.0.19045)
  steps-to-reproduce: |
    1. Перейти по адресу https://products-store.hexlet.app/products/99999
    2. Открыть консоль DevTools
  expected-result: |
    Отображается страница 404 с сообщением об ошибке
  actual-result: |
    Страница полностью пустая
    В консоли браузера возникает ошибка «Cannot read properties of undefined (reading 'map')»

- summary: |
    В мобильной версии блок фильтров занимает весь первый экран, а каталог уходит вниз
  test-cases: [24]
  environment: |
    Тестируемое приложение: https://products-store.hexlet.app/ (версия 1)
    Google Chrome 156.0.8078.48 (64 бит)
    Мобильный viewport 375x812, ОС Windows 10 (10.0.19045)
  steps-to-reproduce: |
    1. Открыть главную страницу https://products-store.hexlet.app/ в мобильном браузере
    2. Оценить расположение блока фильтров и каталога товаров
  expected-result: |
    Каталог товаров отображается первым и доступен без прокрутки через весь блок фильтров
    Горизонтальная прокрутка отсутствует
  actual-result: |
    Первым отображается блок фильтров на всю ширину экрана, занимающий весь первый экран
    Каталог товаров находится ниже и требует длительной прокрутки
    Шапка сайта и элементы навигации расположены неудобно

- summary: |
    Смена языка интерфейса происходит с задержкой около 1 секунды
  test-cases: [21]
  environment: |
    Тестируемое приложение: https://products-store.hexlet.app/ (версия 1)
    Google Chrome 156.0.8078.48 (64 бит)
    ОС Windows 10 (10.0.19045)
  steps-to-reproduce: |
    1. Открыть главную страницу https://products-store.hexlet.app/
    2. Открыть меню «Language» и выбрать «Russian»
    3. Наблюдать за интерфейсом в течение 1 секунды
  expected-result: |
    Интерфейс переводится сразу после выбора языка
  actual-result: |
    Перевод применяется только через 1 секунду, до этого интерфейс остается на английском языке

- summary: |
    В корзине остаток товара на складе отображается с подписью «qty.» и путается с количеством в корзине
  test-cases: [16]
  environment: |
    Тестируемое приложение: https://products-store.hexlet.app/ (версия 1)
    Google Chrome 156.0.8078.48 (64 бит)
    ОС Windows 10 (10.0.19045)
  steps-to-reproduce: |
    1. Добавить товар в корзину
    2. Перейти на страницу корзины /cart
    3. Сравнить значение остатка с подписью «qty.» и количеством товара в корзине
  expected-result: |
    Количество товара в корзине и остаток на складе имеют понятные и различимые подписи
  actual-result: |
    Рядом с названием выводится «99 qty.», что выглядит как количество в корзине
    Фактическое количество в корзине отображается отдельным числом без подписи

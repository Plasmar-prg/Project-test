bugreports:
  - summary: |
      При отсутствии результатов поиска или фильтрации отображаются все товары каталога
    test-cases: [6, 7, 12]
    environment: |
      Тестируемое приложение: https://products-store-v2.hexlet.app/ (версия 2)
      Google Chrome 156.0.8078.48 (64 бит)
      ОС Windows 10 (10.0.19045)
    steps-to-reproduce: |
      1. Открыть главную страницу https://products-store-v2.hexlet.app/
      2. Ввести в поле поиска запрос «zzzznotfound»
      3. Оценить содержимое каталога
    expected-result: |
      Вместо списка товаров отображается сообщение «Nothing found!»
    actual-result: |
      Отображаются все 30 товаров текущей страницы, сообщение об отсутствии результатов не выводится
      Такое же поведение возникает при снятии галочки «In Stock»

  - summary: |
      В карточке товара в каталоге не отображается рейтинг
    test-cases: [2]
    environment: |
      Тестируемое приложение: https://products-store-v2.hexlet.app/ (версия 2)
      Google Chrome 156.0.8078.48 (64 бит)
      ОС Windows 10 (10.0.19045)
    steps-to-reproduce: |
      1. Открыть главную страницу https://products-store-v2.hexlet.app/
      2. Найти карточку товара «Essence Mascara Lash Princess»
      3. Сравнить содержимое карточки с требованиями к каталогу
    expected-result: |
      В карточке каталога отображаются название, рейтинг, цена со скидкой и без нее
    actual-result: |
      В карточке отображаются название, описание, цена без скидки, цена со скидкой и остаток
      Рейтинг в карточке отсутствует

  - summary: |
      Поиск и фильтры работают только в пределах текущей страницы каталога
    test-cases: [6, 8, 9, 10]
    environment: |
      Тестируемое приложение: https://products-store-v2.hexlet.app/ (версия 2)
      Google Chrome 156.0.8078.48 (64 бит)
      ОС Windows 10 (10.0.19045)
    steps-to-reproduce: |
      1. Открыть главную страницу https://products-store-v2.hexlet.app/
      2. Ввести в поле поиска запрос «Lemon»
      3. Убедиться, что товар «Lemon» находится на второй странице каталога
    expected-result: |
      Поиск и фильтрация выполняются по всему каталогу товаров
    actual-result: |
      Поиск и фильтры применяются только к 30 товарам текущей страницы
      Товары с других страниц не находятся

  - summary: |
      Список категорий в фильтре неполный
    test-cases: [8]
    environment: |
      Тестируемое приложение: https://products-store-v2.hexlet.app/ (версия 2)
      Google Chrome 156.0.8078.48 (64 бит)
      ОС Windows 10 (10.0.19045)
    steps-to-reproduce: |
      1. Открыть главную страницу https://products-store-v2.hexlet.app/
      2. Открыть выпадающий список «Category»
      3. Сравнить список категорий с категориями товаров во всем каталоге
    expected-result: |
      В фильтре доступны все категории товаров каталога
    actual-result: |
      В фильтре отображаются только категории текущей страницы, а также пустой пункт «all»
      Категории товаров с других страниц каталога недоступны

  - summary: |
      Поле максимальной цены в фильтре содержит сумму цен товаров вместо максимальной цены
    test-cases: [11]
    environment: |
      Тестируемое приложение: https://products-store-v2.hexlet.app/ (версия 2)
      Google Chrome 156.0.8078.48 (64 бит)
      ОС Windows 10 (10.0.19045)
    steps-to-reproduce: |
      1. Открыть главную страницу https://products-store-v2.hexlet.app/
      2. Обратить внимание на подсказку и атрибут max поля максимальной цены в блоке «Price»
    expected-result: |
      В поле максимальной цены указана максимальная цена товара на странице (2499.99$)
    actual-result: |
      В поле указано значение 6577.499999999995, равное сумме цен всех товаров на странице

  - summary: |
      Кнопка «Delete» в корзине уменьшает количество товара на 1 вместо удаления товара
    test-cases: [17]
    environment: |
      Тестируемое приложение: https://products-store-v2.hexlet.app/ (версия 2)
      Google Chrome 156.0.8078.48 (64 бит)
      ОС Windows 10 (10.0.19045)
    steps-to-reproduce: |
      1. Добавить товар «Essence Mascara Lash Princess» в корзину два раза
      2. Перейти на страницу корзины /cart
      3. Нажать кнопку «Delete» напротив товара
    expected-result: |
      Товар полностью удаляется из корзины
      Счетчик товаров в шапке и итоговая сумма пересчитываются
    actual-result: |
      Количество товара уменьшается с 2 до 1, товар остается в корзине
      Для полного удаления товара кнопку нужно нажать повторно

  - summary: |
      Оформление заказа завершается ошибкой сервера, но интерфейс сообщает об успехе
    test-cases: [20]
    environment: |
      Тестируемое приложение: https://products-store-v2.hexlet.app/ (версия 2)
      Google Chrome 156.0.8078.48 (64 бит)
      ОС Windows 10 (10.0.19045)
    steps-to-reproduce: |
      1. Добавить товар в корзину
      2. Перейти на страницу корзины /cart
      3. Нажать кнопку «Checkout»
      4. Проверить запрос POST /api/orders в DevTools
    expected-result: |
      Заказ успешно создан на сервере
      Пользователь переходит на страницу оплаты
      Корзина очищается после успешного оформления заказа
    actual-result: |
      Запрос POST /api/orders возвращает статус 500
      Отображается модальное окно «Order placed successfully»
      Перехода на страницу оплаты нет, корзина не очищается

  - summary: |
      Выбранный язык интерфейса не сохраняется после перезагрузки страницы
    test-cases: [22]
    environment: |
      Тестируемое приложение: https://products-store-v2.hexlet.app/ (версия 2)
      Google Chrome 156.0.8078.48 (64 бит)
      ОС Windows 10 (10.0.19045)
    steps-to-reproduce: |
      1. Открыть главную страницу https://products-store-v2.hexlet.app/
      2. В меню «Language» выбрать «Russian»
      3. Перезагрузить страницу
    expected-result: |
      После перезагрузки интерфейс остается на русском языке
    actual-result: |
      После перезагрузки интерфейс снова отображается на английском языке

  - summary: |
      Страница несуществующего товара остается пустой и возникает ошибка JavaScript
    test-cases: [23]
    environment: |
      Тестируемое приложение: https://products-store-v2.hexlet.app/ (версия 2)
      Google Chrome 156.0.8078.48 (64 бит)
      ОС Windows 10 (10.0.19045)
    steps-to-reproduce: |
      1. Перейти по адресу https://products-store-v2.hexlet.app/products/99999
      2. Открыть консоль DevTools
    expected-result: |
      Отображается страница 404 с сообщением об ошибке
    actual-result: |
      Страница полностью пустая
      В консоли браузера возникает ошибка «Cannot read properties of undefined (reading 'map')»

---
- id: 1
  summary: |
    Отображение в каталоге названия, цены без скидки и цены со скидкой
  requirement: |
    В каталоге для каждого товара отображаются название, цена без скидки и цена со скидкой
  prerequisites: |
    Открыта главная страница приложения https://products-store.hexlet.app/
  test-data: |
    Товар Essence Mascara Lash Princess:
    цена без скидки = 9.99$
    скидка = 10.48%
    цена со скидкой = 8.94$
  steps:
    - Открыть главную страницу приложения
    - Найти карточку товара «Essence Mascara Lash Princess»
  expected-result: |
    В карточке отображается название «Essence Mascara Lash Princess»
    Отображается перечеркнутая цена без скидки 9.99$
    Отображается цена со скидкой 8.94$

- id: 2
  summary: |
    Отображение рейтинга товара в карточке каталога
  requirement: |
    В каталоге для каждого товара отображается рейтинг
  prerequisites: |
    Открыта главная страница приложения https://products-store.hexlet.app/
  test-data: |
    Рейтинг товара Essence Mascara Lash Princess = 2.56
  steps:
    - Открыть главную страницу приложения
    - Найти карточку товара «Essence Mascara Lash Princess»
  expected-result: |
    В карточке товара отображается значение рейтинга 2.56

- id: 3
  summary: |
    Переход на следующую страницу каталога
  requirement: |
    Каталог товаров имеет постраничный вывод
  prerequisites: |
    Открыта главная страница приложения https://products-store.hexlet.app/
    В каталоге доступна кнопка «Next»
  test-data: |
    Количество товаров на странице = 30
    Общее количество товаров = 194
  steps:
    - Открыть главную страницу приложения
    - Нажать кнопку «Next»
  expected-result: |
    Отображается вторая страница каталога
    На странице отображается 30 товаров, начиная с товара «Lemon»

- id: 4
  summary: |
    Переход на предыдущую страницу каталога
  requirement: |
    Каталог товаров имеет постраничный вывод
  prerequisites: |
    Открыта вторая страница каталога
    В каталоге доступна кнопка «Previous»
  test-data: |
    Количество товаров на странице = 30
  steps:
    - Открыть главную страницу приложения
    - Нажать кнопку «Next»
    - Нажать кнопку «Previous»
  expected-result: |
    Отображается первая страница каталога
    На странице отображается 30 товаров, начиная с товара «Essence Mascara Lash Princess»

- id: 5
  summary: |
    Скрытие кнопки «Previous» на первой странице каталога
  requirement: |
    На первой странице каталога переход на предыдущую страницу невозможен
  prerequisites: |
    Открыта главная страница приложения https://products-store.hexlet.app/
  test-data: |
    Текущая страница = 1
  steps:
    - Открыть главную страницу приложения
    - Проверить блок пагинации
  expected-result: |
    Кнопка «Previous» не отображается на первой странице каталога

- id: 6
  summary: |
    Поиск товара по ключевому слову
  requirement: |
    Пользователь должен иметь возможность искать товары по ключевому слову
  prerequisites: |
    Открыта главная страница приложения https://products-store.hexlet.app/
  test-data: |
    Поисковый запрос = Lemon
    Товар Lemon находится на второй странице каталога
  steps:
    - Открыть главную страницу приложения
    - Ввести в поле поиска запрос «Lemon»
  expected-result: |
    В каталоге отображается товар «Lemon»
    Поиск выполняется по всему каталогу, а не только по текущей странице

- id: 7
  summary: |
    Отображение сообщения при отсутствии результатов поиска
  requirement: |
    При отсутствии товаров, подходящих под условия поиска, пользователь видит сообщение об этом
  prerequisites: |
    Открыта главная страница приложения https://products-store.hexlet.app/
  test-data: |
    Поисковый запрос = zzzznotfound
  steps:
    - Открыть главную страницу приложения
    - Ввести в поле поиска запрос «zzzznotfound»
  expected-result: |
    Вместо списка товаров отображается сообщение «Nothing found!»

- id: 8
  summary: |
    Фильтрация товаров по категории
  requirement: |
    Пользователь должен иметь возможность фильтровать товары по категории
  prerequisites: |
    Открыта главная страница приложения https://products-store.hexlet.app/
  test-data: |
    Категория = groceries
  steps:
    - Открыть главную страницу приложения
    - Открыть выпадающий список «Category»
    - Выбрать категорию «groceries»
  expected-result: |
    В списке категорий доступны все категории каталога
    В каталоге отображаются только товары категории «groceries»

- id: 9
  summary: |
    Фильтрация товаров по бренду
  requirement: |
    Пользователь должен иметь возможность фильтровать товары по бренду
  prerequisites: |
    Открыта главная страница приложения https://products-store.hexlet.app/
  test-data: |
    Бренд = Chanel
  steps:
    - Открыть главную страницу приложения
    - Установить галочку напротив бренда «Chanel»
  expected-result: |
    В каталоге отображается только товар «Chanel Coco Noir Eau De»

- id: 10
  summary: |
    Фильтрация товаров по диапазону цены
  requirement: |
    Пользователь должен иметь возможность фильтровать товары по минимальной и максимальной цене
  prerequisites: |
    Открыта главная страница приложения https://products-store.hexlet.app/
  test-data: |
    Минимальная цена = 1000
  steps:
    - Открыть главную страницу приложения
    - Ввести в поле минимальной цены значение 1000
  expected-result: |
    В каталоге отображаются только товары с ценой больше 1000$:
    «Annibale Colombo Bed» и «Annibale Colombo Sofa»

- id: 11
  summary: |
    Корректный максимум в фильтре цены
  requirement: |
    Поле максимальной цены и его подсказка содержат максимальную цену товара на странице
  prerequisites: |
    Открыта главная страница приложения https://products-store.hexlet.app/
  test-data: |
    Максимальная цена товара на первой странице = 2499.99$
  steps:
    - Открыть главную страницу приложения
    - Проверить значение поля максимальной цены и его подсказку
  expected-result: |
    В поле максимальной цены и в подсказке указана максимальная цена товара 2499.99$

- id: 12
  summary: |
    Фильтрация товаров по наличию
  requirement: |
    Пользователь должен иметь возможность фильтровать товары по наличию на складе
  prerequisites: |
    Открыта главная страница приложения https://products-store.hexlet.app/
  test-data: |
    Галочка «In Stock» установлена по умолчанию
  steps:
    - Открыть главную страницу приложения
    - Снять галочку «In Stock»
  expected-result: |
    В каталоге отображаются все товары, включая отсутствующие в наличии
    Каталог не становится пустым

- id: 13
  summary: |
    Просмотр страницы товара с подробной информацией
  requirement: |
    Пользователь должен иметь возможность просматривать подробную информацию о товаре
  prerequisites: |
    Открыта главная страница приложения https://products-store.hexlet.app/
  test-data: |
    Товар Essence Mascara Lash Princess:
    рейтинг = 2.56
    цена без скидки = 9.99$
    цена со скидкой = 8.94$
    скидка = 10.48%
    остаток = 99
  steps:
    - Открыть главную страницу приложения
    - Нажать на карточку товара «Essence Mascara Lash Princess»
  expected-result: |
    Открывается страница /products/1
    Отображаются название, рейтинг 2.56, цена без скидки 9.99$, цена со скидкой 8.94$, скидка 10.48%, остаток 99 и описание товара

- id: 14
  summary: |
    Добавление товара в корзину из каталога
  requirement: |
    Пользователь должен иметь возможность добавлять товары в корзину
  prerequisites: |
    Открыта главная страница приложения https://products-store.hexlet.app/
    Корзина пуста
  test-data: |
    Товар Essence Mascara Lash Princess
  steps:
    - Открыть главную страницу приложения
    - Нажать кнопку «Add to cart» в карточке товара «Essence Mascara Lash Princess»
  expected-result: |
    В шапке сайта рядом со ссылкой «Cart» появляется счетчик с значением 1
    Товар добавлен в корзину

- id: 15
  summary: |
    Добавление товара в корзину со страницы товара
  requirement: |
    Пользователь должен иметь возможность добавлять товары в корзину со страницы товара
  prerequisites: |
    Открыта страница товара https://products-store.hexlet.app/products/1
    Корзина пуста
  test-data: |
    Товар Essence Mascara Lash Princess
  steps:
    - Открыть страницу товара /products/1
    - Нажать кнопку «Add to cart»
  expected-result: |
    В шапке сайта рядом со ссылкой «Cart» появляется счетчик с значением 1
    Товар добавлен в корзину

- id: 16
  summary: |
    Просмотр содержимого корзины и итоговой суммы
  requirement: |
    Пользователь должен иметь возможность просматривать содержимое корзины
    Стоимость корзины рассчитывается с учетом скидки и количества каждого товара
  prerequisites: |
    В корзину добавлены товары Essence Mascara Lash Princess и Eyeshadow Palette with Mirror по 1 штуке
  test-data: |
    Essence Mascara Lash Princess: цена со скидкой = 8.94$
    Eyeshadow Palette with Mirror: цена со скидкой = 16.35$
  steps:
    - Открыть главную страницу приложения
    - Нажать ссылку «Cart»
  expected-result: |
    Открывается страница /cart
    В корзине отображаются оба товара с количеством 1
    Итоговая сумма равна 25.30$

- id: 17
  summary: |
    Удаление товара из корзины
  requirement: |
    Пользователь должен иметь возможность удалить товар из корзины
  prerequisites: |
    В корзину добавлен товар Essence Mascara Lash Princess в количестве 2 штук
  test-data: |
    Количество товара в корзине = 2
  steps:
    - Открыть страницу корзины /cart
    - Нажать кнопку «Delete» напротив товара «Essence Mascara Lash Princess»
  expected-result: |
    Товар полностью удаляется из корзины
    Счетчик товаров в шапке и итоговая сумма пересчитываются

- id: 18
  summary: |
    Сохранение корзины после перезагрузки страницы
  requirement: |
    Корзина хранится в сессии браузера и сохраняется после перезагрузки страницы
  prerequisites: |
    В корзину добавлен один товар
  test-data: |
    Товар Essence Mascara Lash Princess в количестве 1 штуки
  steps:
    - Добавить товар в корзину
    - Перезагрузить страницу
  expected-result: |
    Счетчик товаров в шапке сохраняет значение 1
    Товар остается в корзине

- id: 19
  summary: |
    Очистка корзины
  requirement: |
    Пользователь должен иметь возможность очистить корзину
  prerequisites: |
    В корзину добавлен один товар
  test-data: |
    Товар Essence Mascara Lash Princess
  steps:
    - Открыть страницу корзины /cart
    - Нажать кнопку «Clear cart»
  expected-result: |
    Корзина становится пустой
    Счетчик товаров в шапке пропадает
    Итоговая сумма равна 0.00$

- id: 20
  summary: |
    Оформление заказа с переходом на страницу оплаты
  requirement: |
    Пользователь должен иметь возможность оформить заказ с переходом на страницу оплаты
  prerequisites: |
    В корзину добавлен товар
    Открыта страница корзины /cart
  test-data: |
    Товар Essence Mascara Lash Princess в количестве 1 штуки
    Итоговая сумма = 8.94$
  steps:
    - Открыть страницу корзины /cart
    - Нажать кнопку «Checkout»
  expected-result: |
    Заказ успешно создан на сервере
    Пользователь переходит на страницу оплаты
    Корзина очищается после успешного оформления заказа

- id: 21
  summary: |
    Переключение языка интерфейса
  requirement: |
    Пользователь должен иметь возможность переключить язык интерфейса
  prerequisites: |
    Открыта главная страница приложения https://products-store.hexlet.app/
    Текущий язык интерфейса = English
  test-data: |
    Выбранный язык = Russian
  steps:
    - Открыть выпадающий список «Language»
    - Выбрать «Russian»
  expected-result: |
    Элементы интерфейса переводятся на русский язык:
    «Store» заменяется на «Магазин», «Cart» на «Корзина», «Language» на «Язык»

- id: 22
  summary: |
    Сохранение выбранного языка после перезагрузки
  requirement: |
    Выбранный пользователем язык интерфейса сохраняется после перезагрузки страницы
  prerequisites: |
    В интерфейсе выбран русский язык
  test-data: |
    Выбранный язык = Russian
  steps:
    - Переключить язык интерфейса на русский
    - Перезагрузить страницу
  expected-result: |
    После перезагрузки интерфейс остается на русском языке

- id: 23
  summary: |
    Отображение страницы 404 для несуществующего товара
  requirement: |
    При переходе на несуществующий товар отображается страница 404 с сообщением об ошибке
  prerequisites: |
    Открыта главная страница приложения https://products-store.hexlet.app/
  test-data: |
    Несуществующий идентификатор товара = 99999
  steps:
    - Перейти по адресу https://products-store.hexlet.app/products/99999
  expected-result: |
    Отображается страница 404 с сообщением об ошибке
    Страница не остается пустой

- id: 24
  summary: |
    Адаптивность каталога на мобильном устройстве
  requirement: |
    Сайт должен иметь мобильную версию и быть удобным на мобильных устройствах
  prerequisites: |
    Открыта главная страница приложения в мобильном браузере с шириной экрана 375px
  test-data: |
    Ширина экрана = 375px
  steps:
    - Открыть главную страницу приложения в мобильном браузере
  expected-result: |
    Каталог товаров отображается первым и доступен без прокрутки через весь блок фильтров
    Отсутствует горизонтальная прокрутка
    Карточки товаров и элементы управления не выходят за пределы экрана

- id: 25
  summary: |
    Прямой переход по URL (SPA-маршрутизация)
  requirement: |
    Приложение работает как SPA и корректно открывает страницы по прямым ссылкам
  prerequisites: |
    Браузер открыт
  test-data: |
    Адреса страниц:
    https://products-store.hexlet.app/
    https://products-store.hexlet.app/products/1
    https://products-store.hexlet.app/cart
  steps:
    - Открыть по очереди каждый адрес из тестовых данных
  expected-result: |
    Каждая страница открывается без ошибок
    Отображаются каталог, страница товара и корзина соответственно
